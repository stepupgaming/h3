[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-voice-api"
version = "0.3.0"
description = "Local OpenAI- and ElevenLabs-compatible speech, music, and SFX API for MiniMax H3 in ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MiniMax H3 Voice API contributors"}]
keywords = ["minimax", "h3", "comfyui", "tts", "voice-cloning", "sfx", "foley", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "onnx-asr>=0.11,<1",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
h3-voice-api = "minimax_voice_api.cli:main"
h3-check = "minimax_voice_api.check_install:main"

[tool.setuptools.packages.find]
include = ["minimax_voice_api*"]

[tool.setuptools.package-data]
minimax_voice_api = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

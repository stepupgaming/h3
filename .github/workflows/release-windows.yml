name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test install layout
        run: cargo test --locked --bin h3 layout_root_requires_the_engine_directory

      - name: Build
        run: cargo build --release --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            $version = $match.Matches[0].Groups[1].Value
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "missing version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "installer version $version"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "installer\h3.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Filter "*-windows-x64-setup.exe" | Select-Object -ExpandProperty FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: h3-${{ steps.version.outputs.version }}-windows-x64-setup
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist -Filter "*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer exe missing" }
          $notesPath = Join-Path $env:RUNNER_TEMP "h3-release-notes.md"
          @(
            "Windows installer for h3 ${{ steps.version.outputs.version }}.",
            "",
            "Run the setup exe. It installs h3 for the current user and adds it to that user's PATH. Open a new terminal, then:",
            "",
            "    h3 setup",
            "    h3 download base",
            "",
            "Install uv and ffmpeg separately. The installer does not download model weights."
          ) | Set-Content -Path $notesPath -Encoding utf8
          gh release create "${{ github.ref_name }}" $exe.FullName --title "${{ github.ref_name }}" --notes-file $notesPath
